kind = "web"
previewPath = "/"
title = "Rundinova Budget Alimentaire"
version = "1.0.0"
id = "artifacts/rundinova"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21078

[services.development]
run = "pnpm --filter @workspace/rundinova run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rundinova", "run", "build" ]
publicDir = "artifacts/rundinova/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21078"
BASE_PATH = "/"
